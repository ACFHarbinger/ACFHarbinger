<svg width="300" height="560" viewBox="0 0 300 560" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Most Used Languages">
  <title>Most Used Languages</title>
  <style>
    .header {
      font: 600 18px 'Segoe UI', Ubuntu, Sans-Serif;
      fill: #38bdf8;
      animation: fadeInAnimation 0.8s ease-in-out forwards;
    }
    .stat {
      font: 600 14px 'Segoe UI', Ubuntu, "Helvetica Neue", Sans-Serif;
      fill: #a9fef7;
    }
    .bold { font-weight: 700; }
    .rank-text {
      font: 800 26px 'Segoe UI', Ubuntu, Sans-Serif;
      fill: #38bdf8;
    }
    .rank-circle-bg {
      stroke: rgba(255, 255, 255, 0.1);
      stroke-width: 4.5;
      fill: none;
    }
    .rank-circle {
      stroke: #38bdf8;
      stroke-width: 4.5;
      fill: none;
      stroke-linecap: round;
      transform: rotate(-90deg);
      transform-origin: center;
    }
    .lang-name {
      font: 600 13px 'Segoe UI', Ubuntu, Sans-Serif;
      fill: #a9fef7;
    }
    .lang-pct {
      font: 400 12px 'Segoe UI', Ubuntu, Sans-Serif;
      fill: #858585;
    }
    @keyframes fadeInAnimation {
      from { opacity: 0; }
      to { opacity: 1; }
    }

  </style>

  <rect x="0.5" y="0.5" rx="4.5" width="299" height="559" fill="#141321" stroke="#38bdf8" stroke-opacity="0.3"/>

  <g transform="translate(25, 35)">
    <text x="0" y="0" class="header">Most Used Languages</text>
  </g>

  <g transform="translate(0, 55)">
    <g transform="translate(0, 0)">
      <text x="25" y="15" class="lang-name">C++</text>
      <text x="270" y="15" text-anchor="end" class="lang-pct">35.90%</text>
      <svg width="245" x="25" y="22">
        <rect rx="4" ry="4" x="0" y="0" width="245" height="8" fill="rgba(255,255,255,0.1)"/>
        <rect rx="4" ry="4" x="0" y="0" width="73" height="8" fill="#f34b7d"/>
      </svg>
    </g>

    <g transform="translate(0, 40)">
