<svg width="300" height="560" viewBox="0 0 300 560" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Most Used Languages">
  <title>Most Used Languages</title>
  <defs>
    <linearGradient id="cardBorderGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.4" />
      <stop offset="50%" stop-color="#2a283e" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.3" />
    </linearGradient>
    <style>
/* SVG Telemetry Theme - Tokyo Night & Cyber Neon */
@keyframes fadeInAnimation {
  from {
    opacity: 0;
    transform: translateY(4px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

@keyframes scaleProgress {
  from {
    width: 0;
  }
}

.card-bg {
  fill: #141321;
  stroke: #2a283e;
  stroke-width: 1.5;
  rx: 8;
  ry: 8;
  filter: drop-shadow(0 8px 24px rgba(0, 0, 0, 0.45));
}

.header {
  font: 700 18px 'Segoe UI', Ubuntu, -apple-system, BlinkMacSystemFont, Roboto, Sans-Serif;
  fill: #38bdf8;
  letter-spacing: -0.2px;
  animation: fadeInAnimation 0.6s ease-in-out forwards;
}

.stat-label {
  font: 600 14px 'Segoe UI', Ubuntu, -apple-system, BlinkMacSystemFont, Roboto, Sans-Serif;
  fill: #a9fef7;
}

.stat-value {
  font: 700 14px 'Segoe UI', Ubuntu, -apple-system, BlinkMacSystemFont, Roboto, Sans-Serif;
  fill: #f1f5f9;
}

.rank-text {
  font: 800 26px 'Segoe UI', Ubuntu, -apple-system, BlinkMacSystemFont, Roboto, Sans-Serif;
  fill: #38bdf8;
  text-shadow: 0 0 10px rgba(56, 189, 248, 0.4);
}

.rank-circle-bg {
  stroke: rgba(255, 255, 255, 0.08);
  stroke-width: 5;
  fill: none;
}

.rank-circle {
  stroke: url(#rankGradient);
  stroke-width: 5;
  fill: none;
  stroke-linecap: round;
  transform: rotate(-90deg);
  transform-origin: center;
  transition: stroke-dashoffset 0.8s ease-in-out;
}

.lang-name {
  font: 600 13px 'Segoe UI', Ubuntu, -apple-system, BlinkMacSystemFont, Roboto, Sans-Serif;
  fill: #e2e8f0;
}

.lang-pct {
  font: 600 12px 'Segoe UI', Ubuntu, -apple-system, BlinkMacSystemFont, Roboto, Sans-Serif;
  fill: #94a3b8;
}

.progress-track {
  fill: rgba(255, 255, 255, 0.07);
  rx: 4;
  ry: 4;
}

.progress-bar {
  rx: 4;
  ry: 4;
  animation: scaleProgress 0.8s ease-out forwards;
}

.icon {
  filter: drop-shadow(0 1px 2px rgba(0, 0, 0, 0.3));
}

    </style>
  </defs>

  <!-- Background Card -->
  <rect x="1" y="1" width="298" height="558" rx="8" class="card-bg" stroke="url(#cardBorderGradient)"/>

  <!-- Card Header -->
  <g transform="translate(25, 35)">
    <text x="0" y="0" class="header">Most Used Languages</text>
  </g>

  <!-- Languages List -->
  <g transform="translate(0, 55)">
    <g transform="translate(0, 0)">
      <circle cx="15" cy="11" r="4" fill="#3572A5" />
      <text x="26" y="15" class="lang-name">Python</text>
      <text x="275" y="15" text-anchor="end" class="lang-pct">37.74%</text>
      <svg width="250" x="25" y="22">
        <rect width="250" height="7" class="progress-track"/>
        <rect width="94" height="7" fill="#3572A5" class="progress-bar"/>
      </svg>
    </g>

    <g transform="translate(0, 40)">
      <circle cx="15" cy="11" r="4" fill="#f34b7d" />
      <text x="26" y="15" class="lang-name">C++</text>
      <text x="275" y="15" text-anchor="end" class="lang-pct">32.25%</text>
      <svg width="250" x="25" y="22">
        <rect width="250" height="7" class="progress-track"/>
        <rect width="80" height="7" fill="#f34b7d" class="progress-bar"/>
      </svg>
    </g>

    <g transform="translate(0, 80)">
      <circle cx="15" cy="11" r="4" fill="#3178c6" />
      <text x="26" y="15" class="lang-name">TypeScript</text>
      <text x="275" y="15" text-anchor="end" class="lang-pct">17.69%</text>
      <svg width="250" x="25" y="22">
        <rect width="250" height="7" class="progress-track"/>
        <rect width="44" height="7" fill="#3178c6" class="progress-bar"/>
      </svg>
    </g>

    <g transform="translate(0, 120)">
      <circle cx="15" cy="11" r="4" fill="#DA5B0B" />
      <text x="26" y="15" class="lang-name">Jupyter Notebook</text>
      <text x="275" y="15" text-anchor="end" class="lang-pct">2.25%</text>
      <svg width="250" x="25" y="22">
        <rect width="250" height="7" class="progress-track"/>
        <rect width="5" height="7" fill="#DA5B0B" class="progress-bar"/>
      </svg>
    </g>

    <g transform="translate(0, 160)">
      <circle cx="15" cy="11" r="4" fill="#dea584" />
      <text x="26" y="15" class="lang-name">Rust</text>
      <text x="275" y="15" text-anchor="end" class="lang-pct">1.78%</text>
      <svg width="250" x="25" y="22">
        <rect width="250" height="7" class="progress-track"/>
        <rect width="4" height="7" fill="#dea584" class="progress-bar"/>
      </svg>
    </g>

    <g transform="translate(0, 200)">
      <circle cx="15" cy="11" r="4" fill="#e34c26" />
      <text x="26" y="15" class="lang-name">HTML</text>
      <text x="275" y="15" text-anchor="end" class="lang-pct">1.14%</text>
      <svg width="250" x="25" y="22">
        <rect width="250" height="7" class="progress-track"/>
        <rect width="3" height="7" fill="#e34c26" class="progress-bar"/>
      </svg>
    </g>

    <g transform="translate(0, 240)">
      <circle cx="15" cy="11" r="4" fill="#555555" />
      <text x="26" y="15" class="lang-name">C</text>
      <text x="275" y="15" text-anchor="end" class="lang-pct">1.12%</text>
      <svg width="250" x="25" y="22">
        <rect width="250" height="7" class="progress-track"/>
        <rect width="3" height="7" fill="#555555" class="progress-bar"/>
      </svg>
    </g>

    <g transform="translate(0, 280)">
      <circle cx="15" cy="11" r="4" fill="#f1e05a" />
      <text x="26" y="15" class="lang-name">JavaScript</text>
      <text x="275" y="15" text-anchor="end" class="lang-pct">1.12%</text>
      <svg width="250" x="25" y="22">
        <rect width="250" height="7" class="progress-track"/>
        <rect width="3" height="7" fill="#f1e05a" class="progress-bar"/>
      </svg>
    </g>

    <g transform="translate(0, 320)">
      <circle cx="15" cy="11" r="4" fill="#DA3434" />
      <text x="26" y="15" class="lang-name">CMake</text>
      <text x="275" y="15" text-anchor="end" class="lang-pct">0.75%</text>
      <svg width="250" x="25" y="22">
        <rect width="250" height="7" class="progress-track"/>
        <rect width="3" height="7" fill="#DA3434" class="progress-bar"/>
      </svg>
    </g>

    <g transform="translate(0, 360)">
      <circle cx="15" cy="11" r="4" fill="#2f4aab" />
      <text x="26" y="15" class="lang-name">KiCad Layout</text>
      <text x="275" y="15" text-anchor="end" class="lang-pct">0.57%</text>
      <svg width="250" x="25" y="22">
        <rect width="250" height="7" class="progress-track"/>
        <rect width="3" height="7" fill="#2f4aab" class="progress-bar"/>
      </svg>
    </g>

    <g transform="translate(0, 400)">
      <circle cx="15" cy="11" r="4" fill="#b07219" />
      <text x="26" y="15" class="lang-name">Java</text>
      <text x="275" y="15" text-anchor="end" class="lang-pct">0.54%</text>
      <svg width="250" x="25" y="22">
        <rect width="250" height="7" class="progress-track"/>
        <rect width="3" height="7" fill="#b07219" class="progress-bar"/>
      </svg>
    </g>

    <g transform="translate(0, 440)">
      <circle cx="15" cy="11" r="4" fill="#663399" />
      <text x="26" y="15" class="lang-name">CSS</text>
      <text x="275" y="15" text-anchor="end" class="lang-pct">0.51%</text>
      <svg width="250" x="25" y="22">
        <rect width="250" height="7" class="progress-track"/>
        <rect width="3" height="7" fill="#663399" class="progress-bar"/>
      </svg>
    </g>

  </g>
</svg>
