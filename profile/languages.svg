<svg width="495" height="195" viewBox="0 0 495 195" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Most Used Languages">
  <title>Most Used Languages</title>
  <defs>
    <linearGradient id="langCardBorderGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.4" />
      <stop offset="50%" stop-color="#2a283e" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.35" />
    </linearGradient>
    <style>
/* SVG Telemetry Theme - Tokyo Night & Cyber Neon */
@keyframes fadeInAnimation {
  from {
    opacity: 0;
    transform: translateY(4px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

@keyframes scaleProgress {
  from {
    width: 0;
  }
}

@keyframes pulseGlow {
  0% {
    filter: drop-shadow(0 0 4px rgba(56, 189, 248, 0.3));
  }
  50% {
    filter: drop-shadow(0 0 10px rgba(56, 189, 248, 0.7));
  }
  100% {
    filter: drop-shadow(0 0 4px rgba(56, 189, 248, 0.3));
  }
}

.card-bg {
  fill: #141321;
  stroke: #2a283e;
  stroke-width: 1.5;
  rx: 10;
  ry: 10;
  filter: drop-shadow(0 10px 30px rgba(0, 0, 0, 0.5));
}

.header {
  font: 700 18px 'Segoe UI', Ubuntu, -apple-system, BlinkMacSystemFont, Roboto, Sans-Serif;
  fill: #38bdf8;
  letter-spacing: -0.2px;
  animation: fadeInAnimation 0.6s ease-in-out forwards;
}

.stat-label {
  font: 600 14px 'Segoe UI', Ubuntu, -apple-system, BlinkMacSystemFont, Roboto, Sans-Serif;
  fill: #a9fef7;
}

.stat-value {
  font: 700 14px 'Segoe UI', Ubuntu, -apple-system, BlinkMacSystemFont, Roboto, Sans-Serif;
  fill: #f1f5f9;
}

.rank-text {
  font: 800 28px 'Segoe UI', Ubuntu, -apple-system, BlinkMacSystemFont, Roboto, Sans-Serif;
  fill: #38bdf8;
  text-shadow: 0 0 12px rgba(56, 189, 248, 0.5);
}

.rank-pill {
  font: 700 10px 'Segoe UI', Ubuntu, -apple-system, BlinkMacSystemFont, Roboto, Sans-Serif;
  fill: #a9fef7;
  letter-spacing: 0.3px;
}

.rank-pill-bg {
  fill: rgba(56, 189, 248, 0.12);
  stroke: rgba(56, 189, 248, 0.3);
  stroke-width: 1;
  rx: 4;
  ry: 4;
}

.rank-circle-bg {
  stroke: rgba(255, 255, 255, 0.08);
  stroke-width: 5;
  fill: none;
}

.rank-circle {
  stroke: url(#rankGradient);
  stroke-width: 5;
  fill: none;
  stroke-linecap: round;
  transform: rotate(-90deg);
  transform-origin: center;
  animation: pulseGlow 4s infinite ease-in-out;
  transition: stroke-dashoffset 0.8s ease-in-out;
}

.lang-name {
  font: 600 13px 'Segoe UI', Ubuntu, -apple-system, BlinkMacSystemFont, Roboto, Sans-Serif;
  fill: #e2e8f0;
}

.lang-pct {
  font: 600 12px 'Segoe UI', Ubuntu, -apple-system, BlinkMacSystemFont, Roboto, Sans-Serif;
  fill: #94a3b8;
}

.progress-track {
  fill: rgba(255, 255, 255, 0.07);
  rx: 4;
  ry: 4;
}

.progress-bar {
  rx: 4;
  ry: 4;
  animation: scaleProgress 0.8s ease-out forwards;
}

.icon {
  filter: drop-shadow(0 1px 2px rgba(0, 0, 0, 0.3));
}

    </style>
  </defs>

  <!-- Background Card -->
  <rect x="1" y="1" width="493" height="193" rx="10" class="card-bg" stroke="url(#langCardBorderGradient)"/>

  <!-- Card Header -->
  <g transform="translate(25, 35)">
    <text x="0" y="0" class="header">Most Used Languages</text>
  </g>

  <!-- Languages 2-Column Grid -->
  <g transform="translate(0, 50)">
    <g transform="translate(25, 0)">
      <circle cx="6" cy="10" r="4" fill="#3572A5" />
      <text x="16" y="14" class="lang-name">Python</text>
      <text x="200" y="14" text-anchor="end" class="lang-pct">37.7%</text>
      <svg width="195" x="5" y="20">
        <rect width="195" height="6" class="progress-track"/>
        <rect width="73" height="6" fill="#3572A5" class="progress-bar"/>
      </svg>
    </g>

    <g transform="translate(25, 32)">
      <circle cx="6" cy="10" r="4" fill="#f34b7d" />
      <text x="16" y="14" class="lang-name">C++</text>
      <text x="200" y="14" text-anchor="end" class="lang-pct">32.3%</text>
      <svg width="195" x="5" y="20">
        <rect width="195" height="6" class="progress-track"/>
        <rect width="62" height="6" fill="#f34b7d" class="progress-bar"/>
      </svg>
    </g>

    <g transform="translate(25, 64)">
      <circle cx="6" cy="10" r="4" fill="#3178c6" />
      <text x="16" y="14" class="lang-name">TypeScript</text>
      <text x="200" y="14" text-anchor="end" class="lang-pct">17.7%</text>
      <svg width="195" x="5" y="20">
        <rect width="195" height="6" class="progress-track"/>
        <rect width="34" height="6" fill="#3178c6" class="progress-bar"/>
      </svg>
    </g>

    <g transform="translate(25, 96)">
      <circle cx="6" cy="10" r="4" fill="#DA5B0B" />
      <text x="16" y="14" class="lang-name">Jupyter Notebook</text>
      <text x="200" y="14" text-anchor="end" class="lang-pct">2.3%</text>
      <svg width="195" x="5" y="20">
        <rect width="195" height="6" class="progress-track"/>
        <rect width="4" height="6" fill="#DA5B0B" class="progress-bar"/>
      </svg>
    </g>

    <g transform="translate(265, 0)">
      <circle cx="6" cy="10" r="4" fill="#dea584" />
      <text x="16" y="14" class="lang-name">Rust</text>
      <text x="200" y="14" text-anchor="end" class="lang-pct">1.8%</text>
      <svg width="195" x="5" y="20">
        <rect width="195" height="6" class="progress-track"/>
        <rect width="4" height="6" fill="#dea584" class="progress-bar"/>
      </svg>
    </g>

    <g transform="translate(265, 32)">
      <circle cx="6" cy="10" r="4" fill="#e34c26" />
      <text x="16" y="14" class="lang-name">HTML</text>
      <text x="200" y="14" text-anchor="end" class="lang-pct">1.1%</text>
      <svg width="195" x="5" y="20">
        <rect width="195" height="6" class="progress-track"/>
        <rect width="4" height="6" fill="#e34c26" class="progress-bar"/>
      </svg>
    </g>

    <g transform="translate(265, 64)">
      <circle cx="6" cy="10" r="4" fill="#555555" />
      <text x="16" y="14" class="lang-name">C</text>
      <text x="200" y="14" text-anchor="end" class="lang-pct">1.1%</text>
      <svg width="195" x="5" y="20">
        <rect width="195" height="6" class="progress-track"/>
        <rect width="4" height="6" fill="#555555" class="progress-bar"/>
      </svg>
    </g>

    <g transform="translate(265, 96)">
      <circle cx="6" cy="10" r="4" fill="#f1e05a" />
      <text x="16" y="14" class="lang-name">JavaScript</text>
      <text x="200" y="14" text-anchor="end" class="lang-pct">1.1%</text>
      <svg width="195" x="5" y="20">
        <rect width="195" height="6" class="progress-track"/>
        <rect width="4" height="6" fill="#f1e05a" class="progress-bar"/>
      </svg>
    </g>

  </g>
</svg>
