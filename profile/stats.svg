<svg width="495" height="195" viewBox="0 0 495 195" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Afonso Cruz Fernandes's GitHub Stats">
  <title>Afonso Cruz Fernandes's GitHub Stats</title>
  <defs>
    <linearGradient id="rankGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#a9fef7" />
    </linearGradient>
    <linearGradient id="cardBorderGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.4" />
      <stop offset="50%" stop-color="#2a283e" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.3" />
    </linearGradient>
    <style>
/* SVG Telemetry Theme - Tokyo Night & Cyber Neon */
@keyframes fadeInAnimation {
  from {
    opacity: 0;
    transform: translateY(4px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

@keyframes scaleProgress {
  from {
    width: 0;
  }
}

.card-bg {
  fill: #141321;
  stroke: #2a283e;
  stroke-width: 1.5;
  rx: 8;
  ry: 8;
  filter: drop-shadow(0 8px 24px rgba(0, 0, 0, 0.45));
}

.header {
  font: 700 18px 'Segoe UI', Ubuntu, -apple-system, BlinkMacSystemFont, Roboto, Sans-Serif;
  fill: #38bdf8;
  letter-spacing: -0.2px;
  animation: fadeInAnimation 0.6s ease-in-out forwards;
}

.stat-label {
  font: 600 14px 'Segoe UI', Ubuntu, -apple-system, BlinkMacSystemFont, Roboto, Sans-Serif;
  fill: #a9fef7;
}

.stat-value {
  font: 700 14px 'Segoe UI', Ubuntu, -apple-system, BlinkMacSystemFont, Roboto, Sans-Serif;
  fill: #f1f5f9;
}

.rank-text {
  font: 800 26px 'Segoe UI', Ubuntu, -apple-system, BlinkMacSystemFont, Roboto, Sans-Serif;
  fill: #38bdf8;
  text-shadow: 0 0 10px rgba(56, 189, 248, 0.4);
}

.rank-circle-bg {
  stroke: rgba(255, 255, 255, 0.08);
  stroke-width: 5;
  fill: none;
}

.rank-circle {
  stroke: url(#rankGradient);
  stroke-width: 5;
  fill: none;
  stroke-linecap: round;
  transform: rotate(-90deg);
  transform-origin: center;
  transition: stroke-dashoffset 0.8s ease-in-out;
}

.lang-name {
  font: 600 13px 'Segoe UI', Ubuntu, -apple-system, BlinkMacSystemFont, Roboto, Sans-Serif;
  fill: #e2e8f0;
}

.lang-pct {
  font: 600 12px 'Segoe UI', Ubuntu, -apple-system, BlinkMacSystemFont, Roboto, Sans-Serif;
  fill: #94a3b8;
}

.progress-track {
  fill: rgba(255, 255, 255, 0.07);
  rx: 4;
  ry: 4;
}

.progress-bar {
  rx: 4;
  ry: 4;
  animation: scaleProgress 0.8s ease-out forwards;
}

.icon {
  filter: drop-shadow(0 1px 2px rgba(0, 0, 0, 0.3));
}

    </style>
  </defs>

  <!-- Background Card -->
  <rect x="1" y="1" width="493" height="193" rx="8" class="card-bg" stroke="url(#cardBorderGradient)"/>

  <!-- Card Header -->
  <g transform="translate(25, 35)">
    <text x="0" y="0" class="header">Afonso Cruz Fernandes's GitHub Stats</text>
  </g>

  <!-- Stat Items -->
  <g transform="translate(25, 55)">
    <!-- Stars -->
    <g transform="translate(0, 0)">
      <svg x="0" y="0" width="16" height="16" viewBox="0 0 16 16" fill="#f8d000" class="icon">
        <path d="M8 .25a.75.75 0 01.673.418l1.882 3.815 4.21.612a.75.75 0 01.416 1.279l-3.046 2.97.719 4.192a.75.75 0 01-1.088.791L8 12.347l-3.766 1.98a.75.75 0 01-1.088-.79l.72-4.194L.818 6.374a.75.75 0 01.416-1.28l4.21-.611L7.327.668A.75.75 0 018 .25z"/>
      </svg>
      <text x="25" y="12.5" class="stat-label">Total Stars:</text>
      <text x="200" y="12.5" class="stat-value">26</text>
    </g>

    <!-- Commits -->
    <g transform="translate(0, 25)">
      <svg x="0" y="0" width="16" height="16" viewBox="0 0 16 16" fill="#38bdf8" class="icon">
        <path d="M10.5 5a2.5 2.5 0 11-5 0 2.5 2.5 0 015 0zm.01 4.5A4.5 4.5 0 0115 14a.75.75 0 01-1.5 0 3 3 0 00-6 0 .75.75 0 01-1.5 0 4.5 4.5 0 014.51-4.5zM3.5 4a1.5 1.5 0 100 3 1.5 1.5 0 000-3z"/>
      </svg>
      <text x="25" y="12.5" class="stat-label">Total Commits:</text>
      <text x="200" y="12.5" class="stat-value">6,530</text>
    </g>

    <!-- PRs -->
    <g transform="translate(0, 50)">
      <svg x="0" y="0" width="16" height="16" viewBox="0 0 16 16" fill="#a9fef7" class="icon">
        <path d="M7.177 3.073L9.573.677A.25.25 0 0110 .854v4.792a.25.25 0 01-.427.177L7.177 3.427a.25.25 0 010-.354zM3.75 2.5a.75.75 0 100 1.5.75.75 0 000-1.5zm0 9.5a.75.75 0 100 1.5.75.75 0 000-1.5z"/>
      </svg>
      <text x="25" y="12.5" class="stat-label">Total PRs:</text>
      <text x="200" y="12.5" class="stat-value">6</text>
    </g>

    <!-- Issues -->
    <g transform="translate(0, 75)">
      <svg x="0" y="0" width="16" height="16" viewBox="0 0 16 16" fill="#f43f5e" class="icon">
        <path d="M8 1.5a6.5 6.5 0 100 13 6.5 6.5 0 000-13zM0 8a8 8 0 1116 0A8 8 0 010 8zm9 3a1 1 0 11-2 0 1 1 0 012 0zm-.25-6.25a.75.75 0 00-1.5 0v3.5a.75.75 0 001.5 0v-3.5z"/>
      </svg>
      <text x="25" y="12.5" class="stat-label">Total Issues:</text>
      <text x="200" y="12.5" class="stat-value">936</text>
    </g>

    <!-- Repositories Contributed -->
    <g transform="translate(0, 100)">
      <svg x="0" y="0" width="16" height="16" viewBox="0 0 16 16" fill="#c084fc" class="icon">
        <path d="M2 2.5A1.5 1.5 0 013.5 1h9A1.5 1.5 0 0114 2.5v11a1.5 1.5 0 01-1.5 1.5h-9A1.5 1.5 0 012 13.5v-11z"/>
      </svg>
      <text x="25" y="12.5" class="stat-label">Contributed to:</text>
      <text x="200" y="12.5" class="stat-value">71</text>
    </g>
  </g>

  <!-- Circular Rank Display -->
  <g transform="translate(400, 110)">
    <circle cx="0" cy="0" r="40" class="rank-circle-bg"/>
    <circle cx="0" cy="0" r="40" class="rank-circle" stroke-dasharray="251.3" stroke-dashoffset="139.7"/>
    <text x="0" y="9" text-anchor="middle" class="rank-text">B</text>
  </g>
</svg>
