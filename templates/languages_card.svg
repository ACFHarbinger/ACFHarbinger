<svg width="495" height="195" viewBox="0 0 495 195" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Most Used Languages">
  <title>Most Used Languages</title>
  <defs>
    <linearGradient id="langCardBorderGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.4" />
      <stop offset="50%" stop-color="#2a283e" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.35" />
    </linearGradient>
    <style>
${styles}
    </style>
  </defs>

  <!-- Background Card -->
  <rect x="1" y="1" width="493" height="193" rx="10" class="card-bg" stroke="url(#langCardBorderGradient)"/>

  <!-- Card Header -->
  <g transform="translate(25, 35)">
    <text x="0" y="0" class="header">Most Used Languages</text>
  </g>

  <!-- Languages 2-Column Grid -->
  <g transform="translate(0, 50)">
${language_items}
  </g>
</svg>
